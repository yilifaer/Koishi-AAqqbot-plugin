name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        if: matrix.node == 22
      - run: npm test
        if: matrix.node == 22
      - run: npm run build
      # Koishi Desktop 实际用 CommonJS 加载插件；确认编译结果在这个 Node 版本上能加载
      - name: 用 CommonJS 加载编译结果
        run: |
          node -e "
            const p = require('./lib')
            if (p.name !== 'aaqqbot' || typeof p.apply !== 'function') process.exit(1)
            p.Config({ aaBaseUrl: 'https://a.example.com', keyId: 'k', secret: 's' })
          "
